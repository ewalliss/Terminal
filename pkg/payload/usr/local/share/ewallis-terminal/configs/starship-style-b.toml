# Catppuccin Mocha – Starship prompt (Style B: Text-only, no background)
# Requires: JetBrainsMono Nerd Font
# All icons: BMP-only Nerd Font glyphs (nf-fa-*, nf-dev-*, nf-seti-*)

"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 2000

# ── Segment order ──────────────────────────────────────────────────────────────
# mauve: os · user   pink:  dir   blue: branch · status
# green: python   teal: node   peach/sky/yellow/…: rest
# $fill pushes duration + clock to the right edge of line 1 (the info line),
# so nothing sits on the line you type on
format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$java\
$ruby\
$php\
$c\
$swift\
$kotlin\
$lua\
$rlang\
$julia\
$elixir\
$erlang\
$scala\
$dart\
$haskell\
$nim\
$zig\
$docker_context\
$kubernetes\
$aws\
$gcloud\
$azure\
$terraform\
$conda\
$package\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

