# ── OS ─────────────────────────────────────────────────────────────────────────
[os]
disabled = false
style    = "fg:mauve"
format   = '[$symbol]($style)'

[os.symbols]
Macos   = "  "   # nf-fa-apple
Linux   = "  "   # nf-fa-linux
Windows = "  "   # nf-fa-windows
Ubuntu  = "  "   # nf-linux-ubuntu
Debian  = "  "   # nf-linux-debian
Arch    = "  "   # nf-linux-archlinux
Fedora  = "  "   # nf-linux-fedora
Alpine  = "  "   # nf-linux-alpine
Android = "  "   # nf-fa-android

# ── Username ───────────────────────────────────────────────────────────────────
[username]
show_always = true
style_user  = "fg:mauve"
style_root  = "fg:red"
format      = '[$user]($style)'

# ── Directory ──────────────────────────────────────────────────────────────────
[directory]
style             = "fg:pink"
format            = '[  $path ]($style)'   # nf-fa-folder
read_only         = " "                     # nf-fa-lock
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"~"         = "~"
"Documents" = " Documents"
"Downloads" = " Downloads"
"Music"     = " Music"
"Pictures"  = " Pictures"
"Desktop"   = " Desktop"
"Projects"  = " Projects"
"Developer" = " Developer"

# ── Git ────────────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "    # nf-dev-git_branch
style  = "fg:blue"
format = '[[ $symbol$branch ](fg:blue)]($style)'

[git_status]
style       = "fg:blue"
format      = '[[($all_status$ahead_behind )](fg:blue)]($style)'
modified    = " "    # nf-fa-pencil
staged      = " "    # nf-fa-plus
untracked   = " "    # nf-fa-question_circle
deleted     = " "    # nf-fa-minus_circle
renamed     = " "    # nf-fa-arrow_right
conflicted  = " "    # nf-fa-exclamation_circle
ahead       = ""     # nf-fa-arrow_up
behind      = ""     # nf-fa-arrow_down
diverged    = " "    # nf-fa-arrows_v
stashed     = " "    # nf-oct-package

# ── Python ─────────────────────────────────────────────────────────────────────
[python]
symbol            = " "    # nf-dev-python
style             = "fg:green"
format            = '[[ $symbol$version(\($virtualenv\)) ](fg:green)]($style)'
detect_extensions = ["py"]
detect_files      = [".python-version", "Pipfile", "pyproject.toml", "setup.py", "requirements.txt", "tox.ini"]

# ── Node.js ────────────────────────────────────────────────────────────────────
[nodejs]
symbol       = " "    # nf-dev-nodejs_small
style        = "fg:teal"
format       = '[[ $symbol$version ](fg:teal)]($style)'
detect_files = ["package.json", ".nvmrc", ".node-version"]

# ── Rust ───────────────────────────────────────────────────────────────────────
[rust]
symbol = " "    # nf-dev-rust
style  = "fg:peach"
format = '[[ $symbol$version ](fg:peach)]($style)'

# ── Go ─────────────────────────────────────────────────────────────────────────
[golang]
symbol = " "    # nf-seti-go
style  = "fg:sky"
format = '[[ $symbol$version ](fg:sky)]($style)'

# ── Java ───────────────────────────────────────────────────────────────────────
[java]
symbol = " "    # nf-dev-java
style  = "fg:yellow"
format = '[[ $symbol$version ](fg:yellow)]($style)'

# ── Ruby ───────────────────────────────────────────────────────────────────────
[ruby]
symbol = " "    # nf-dev-ruby
style  = "fg:red"
format = '[[ $symbol$version ](fg:red)]($style)'

# ── PHP ────────────────────────────────────────────────────────────────────────
[php]
symbol = " "    # nf-seti-php
style  = "fg:mauve"
format = '[[ $symbol$version ](fg:mauve)]($style)'

# ── C / C++ ────────────────────────────────────────────────────────────────────
[c]
symbol = " "    # nf-seti-c
style  = "fg:sapphire"
format = '[[ $symbol$version ](fg:sapphire)]($style)'

# ── Swift ──────────────────────────────────────────────────────────────────────
[swift]
symbol = " "    # nf-dev-swift
style  = "fg:peach"
format = '[[ $symbol$version ](fg:peach)]($style)'

# ── Kotlin ─────────────────────────────────────────────────────────────────────
[kotlin]
symbol = " "    # nf-seti-kotlin
style  = "fg:mauve"
format = '[[ $symbol$version ](fg:mauve)]($style)'

# ── Lua ────────────────────────────────────────────────────────────────────────
[lua]
symbol = " "    # nf-seti-lua
style  = "fg:blue"
format = '[[ $symbol$version ](fg:blue)]($style)'

# ── R ──────────────────────────────────────────────────────────────────────────
[rlang]
symbol = " "    # nf-seti-r
style  = "fg:blue"
format = '[[ $symbol$version ](fg:blue)]($style)'

# ── Julia ──────────────────────────────────────────────────────────────────────
[julia]
symbol = " "    # nf-md-julia
style  = "fg:mauve"
format = '[[ $symbol$version ](fg:mauve)]($style)'

# ── Elixir ─────────────────────────────────────────────────────────────────────
[elixir]
symbol = " "    # nf-dev-elixir
style  = "fg:mauve"
format = '[[ $symbol$version ](fg:mauve)]($style)'

# ── Erlang ─────────────────────────────────────────────────────────────────────
[erlang]
symbol = " "    # nf-dev-erlang
style  = "fg:red"
format = '[[ $symbol$version ](fg:red)]($style)'

# ── Scala ──────────────────────────────────────────────────────────────────────
[scala]
symbol = " "    # nf-dev-scala
style  = "fg:red"
format = '[[ $symbol$version ](fg:red)]($style)'

# ── Dart ───────────────────────────────────────────────────────────────────────
[dart]
symbol = " "    # nf-dev-dart
style  = "fg:blue"
format = '[[ $symbol$version ](fg:blue)]($style)'

# ── Haskell ────────────────────────────────────────────────────────────────────
[haskell]
symbol = " "    # nf-dev-haskell
style  = "fg:mauve"
format = '[[ $symbol$version ](fg:mauve)]($style)'

# ── Nim ────────────────────────────────────────────────────────────────────────
[nim]
symbol = " "    # nf-fa-star
style  = "fg:yellow"
format = '[[ $symbol$version ](fg:yellow)]($style)'

# ── Zig ────────────────────────────────────────────────────────────────────────
[zig]
symbol = " "    # nf-dev-zig
style  = "fg:peach"
format = '[[ $symbol$version ](fg:peach)]($style)'

# ── Docker ─────────────────────────────────────────────────────────────────────
[docker_context]
symbol = " "    # nf-dev-docker
style  = "fg:blue"
format = '[[ $symbol$context ](fg:blue)]($style)'

# ── Kubernetes ─────────────────────────────────────────────────────────────────
[kubernetes]
disabled = false
symbol   = " "    # nf-dev-kubernetes
style    = "fg:blue"
format   = '[[ $symbol$context(\[$namespace\]) ](fg:blue)]($style)'

# ── AWS ────────────────────────────────────────────────────────────────────────
[aws]
symbol = " "    # nf-dev-aws
style  = "fg:peach"
format = '[[ $symbol$profile(\[$region\]) ](fg:peach)]($style)'

# ── Google Cloud ───────────────────────────────────────────────────────────────
[gcloud]
symbol = " "    # nf-dev-googlecloud
style  = "fg:blue"
format = '[[ $symbol$account(@$domain)(\[$region\]) ](fg:blue)]($style)'

# ── Azure ──────────────────────────────────────────────────────────────────────
[azure]
disabled = false
symbol   = " "    # nf-dev-azure
style    = "fg:blue"
format   = '[[ $symbol$subscription ](fg:blue)]($style)'

# ── Terraform ──────────────────────────────────────────────────────────────────
[terraform]
symbol = " "    # nf-seti-terraform
style  = "fg:mauve"
format = '[[ $symbol$workspace ](fg:mauve)]($style)'

# ── Conda ──────────────────────────────────────────────────────────────────────
[conda]
symbol = " "    # nf-oct-package
style  = "fg:green"
format = '[[ $symbol$environment ](fg:green)]($style)'

# ── Package version ────────────────────────────────────────────────────────────
[package]
symbol   = " "    # nf-oct-package
style    = "fg:peach"
format   = '[[ $symbol$version ](fg:peach)]($style)'
disabled = false

# ── Right side ─────────────────────────────────────────────────────────────────

[fill]
symbol = ' '

[cmd_duration]
min_time = 500
style    = "fg:yellow"
format   = '[ $duration ]($style)'    # nf-fa-hourglass_half

[time]
disabled    = false
time_format = "%H:%M"
style       = "fg:subtext1"
format      = '[ $time ]($style)'    # nf-fa-clock_o

# ── Prompt character ───────────────────────────────────────────────────────────
[character]
success_symbol = '[❯](bold green)'
error_symbol   = '[❯](bold red)'
vimcmd_symbol  = '[❮](bold mauve)'
