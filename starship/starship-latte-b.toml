# Catppuccin Latte – Starship prompt (Style B: Text-only, no background)
# Requires: JetBrainsMono Nerd Font
# All icons: Nerd Fonts Material Design (nf-md-*) set

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$java\
$ruby\
$php\
$c\
$swift\
$kotlin\
$lua\
$rlang\
$julia\
$elixir\
$erlang\
$scala\
$dart\
$haskell\
$nim\
$zig\
$docker_context\
$kubernetes\
$aws\
$gcloud\
$azure\
$terraform\
$conda\
$package\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

palette = 'catppuccin_latte'

[palettes.catppuccin_latte]
rosewater = "#dc8a78"
flamingo  = "#dd7878"
pink      = "#ea76cb"
mauve     = "#8839ef"
red       = "#d20f39"
maroon    = "#e64553"
peach     = "#fe640b"
yellow    = "#df8e1d"
green     = "#40a02b"
teal      = "#179299"
sky       = "#04a5e5"
sapphire  = "#209fb5"
blue      = "#1e66f5"
lavender  = "#7287fd"
text      = "#4c4f69"
subtext1  = "#5c5f77"
subtext0  = "#6c6f85"
overlay2  = "#7c7f93"
overlay1  = "#8c8fa1"
overlay0  = "#9ca0b0"
surface2  = "#acb0be"
surface1  = "#bcc0cc"
surface0  = "#ccd0da"
base      = "#eff1f5"
mantle    = "#e6e9ef"
crust     = "#dce0e8"

# ── OS ─────────────────────────────────────────────────────────────────────────
[os]
disabled = false
style    = "fg:mauve"
format   = '[$symbol]($style)'

[os.symbols]
Macos   = "  "
Linux   = "  "
Windows = "  "
Ubuntu  = "  "
Debian  = "  "
Arch    = "  "
Fedora  = "  "
Alpine  = "  "
Android = "  "

# ── Username ───────────────────────────────────────────────────────────────────
[username]
show_always = true
style_user  = "fg:mauve"
style_root  = "fg:red"
format      = '[ $user ]($style)'

# ── Directory ──────────────────────────────────────────────────────────────────
[directory]
style             = "fg:pink"
format            = '[ 󰉋 $path ]($style)'
read_only         = " 󰌾"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"~"         = "~"
"Documents" = "󰈙 Documents"
"Downloads" = "󰇚 Downloads"
"Music"     = "󰝚 Music"
"Pictures"  = "󰋩 Pictures"
"Desktop"   = "󰇄 Desktop"
"Projects"  = "󰏗 Projects"
"Developer" = "󰏗 Developer"

# ── Git ────────────────────────────────────────────────────────────────────────
[git_branch]
symbol = "󰘬 "
style  = "fg:blue"
format = '[[ $symbol$branch ](fg:blue)]($style)'

[git_status]
style       = "fg:blue"
format      = '[[($all_status$ahead_behind )](fg:blue)]($style)'
modified    = "󰏭 "
staged      = "󰐕 "
untracked   = "󰋗 "
deleted     = "󰍶 "
renamed     = "󰁔 "
conflicted  = "󰀨 "
ahead       = "󰜷"
behind      = "󰜮"
diverged    = "󰹹 "
stashed     = "󰏗 "

# ── Python ─────────────────────────────────────────────────────────────────────
[python]
symbol            = "󰌠 "
style             = "fg:green"
format            = '[[ $symbol$version(\($virtualenv\)) ](fg:green)]($style)'
detect_extensions = ["py"]
detect_files      = [".python-version", "Pipfile", "pyproject.toml", "setup.py", "requirements.txt", "tox.ini"]

# ── Node.js ────────────────────────────────────────────────────────────────────
[nodejs]
symbol       = "󰎙 "
style        = "fg:teal"
format       = '[[ $symbol$version ](fg:teal)]($style)'
detect_files = ["package.json", ".nvmrc", ".node-version"]

# ── Rust ───────────────────────────────────────────────────────────────────────
[rust]
symbol = "󱘗 "
style  = "fg:peach"
format = '[[ $symbol$version ](fg:peach)]($style)'

# ── Go ─────────────────────────────────────────────────────────────────────────
[golang]
symbol = "󰟓 "
style  = "fg:sky"
format = '[[ $symbol$version ](fg:sky)]($style)'

# ── Java ───────────────────────────────────────────────────────────────────────
[java]
symbol = "󰬷 "
style  = "fg:yellow"
format = '[[ $symbol$version ](fg:yellow)]($style)'

# ── Ruby ───────────────────────────────────────────────────────────────────────
[ruby]
symbol = "󰴭 "
style  = "fg:red"
format = '[[ $symbol$version ](fg:red)]($style)'

# ── PHP ────────────────────────────────────────────────────────────────────────
[php]
symbol = "󰌟 "
style  = "fg:mauve"
format = '[[ $symbol$version ](fg:mauve)]($style)'

# ── C / C++ ────────────────────────────────────────────────────────────────────
[c]
symbol = "󰙱 "
style  = "fg:sapphire"
format = '[[ $symbol$version ](fg:sapphire)]($style)'

# ── Swift ──────────────────────────────────────────────────────────────────────
[swift]
symbol = "󰛥 "
style  = "fg:peach"
format = '[[ $symbol$version ](fg:peach)]($style)'

# ── Kotlin ─────────────────────────────────────────────────────────────────────
[kotlin]
symbol = "󱈙 "
style  = "fg:mauve"
format = '[[ $symbol$version ](fg:mauve)]($style)'

# ── Lua ────────────────────────────────────────────────────────────────────────
[lua]
symbol = "󰢱 "
style  = "fg:blue"
format = '[[ $symbol$version ](fg:blue)]($style)'

# ── R ──────────────────────────────────────────────────────────────────────────
[rlang]
symbol = "󰟔 "
style  = "fg:blue"
format = '[[ $symbol$version ](fg:blue)]($style)'

# ── Julia ──────────────────────────────────────────────────────────────────────
[julia]
symbol = " "
style  = "fg:mauve"
format = '[[ $symbol$version ](fg:mauve)]($style)'

# ── Elixir ─────────────────────────────────────────────────────────────────────
[elixir]
symbol = " "
style  = "fg:mauve"
format = '[[ $symbol$version ](fg:mauve)]($style)'

# ── Erlang ─────────────────────────────────────────────────────────────────────
[erlang]
symbol = " "
style  = "fg:red"
format = '[[ $symbol$version ](fg:red)]($style)'

# ── Scala ──────────────────────────────────────────────────────────────────────
[scala]
symbol = " "
style  = "fg:red"
format = '[[ $symbol$version ](fg:red)]($style)'

# ── Dart ───────────────────────────────────────────────────────────────────────
[dart]
symbol = " "
style  = "fg:blue"
format = '[[ $symbol$version ](fg:blue)]($style)'

# ── Haskell ────────────────────────────────────────────────────────────────────
[haskell]
symbol = "󰲒 "
style  = "fg:mauve"
format = '[[ $symbol$version ](fg:mauve)]($style)'

# ── Nim ────────────────────────────────────────────────────────────────────────
[nim]
symbol = "󰆥 "
style  = "fg:yellow"
format = '[[ $symbol$version ](fg:yellow)]($style)'

# ── Zig ────────────────────────────────────────────────────────────────────────
[zig]
symbol = " "
style  = "fg:peach"
format = '[[ $symbol$version ](fg:peach)]($style)'

# ── Docker ─────────────────────────────────────────────────────────────────────
[docker_context]
symbol = "󰡨 "
style  = "fg:blue"
format = '[[ $symbol$context ](fg:blue)]($style)'

# ── Kubernetes ─────────────────────────────────────────────────────────────────
[kubernetes]
disabled = false
symbol   = "󱃾 "
style    = "fg:blue"
format   = '[[ $symbol$context(\[$namespace\]) ](fg:blue)]($style)'

# ── AWS ────────────────────────────────────────────────────────────────────────
[aws]
symbol = "󰸏 "
style  = "fg:peach"
format = '[[ $symbol$profile(\[$region\]) ](fg:peach)]($style)'

# ── Google Cloud ───────────────────────────────────────────────────────────────
[gcloud]
symbol = "󱇶 "
style  = "fg:blue"
format = '[[ $symbol$account(@$domain)(\[$region\]) ](fg:blue)]($style)'

# ── Azure ──────────────────────────────────────────────────────────────────────
[azure]
disabled = false
symbol   = "󰠅 "
style    = "fg:blue"
format   = '[[ $symbol$subscription ](fg:blue)]($style)'

# ── Terraform ──────────────────────────────────────────────────────────────────
[terraform]
symbol = "󱁢 "
style  = "fg:mauve"
format = '[[ $symbol$workspace ](fg:mauve)]($style)'

# ── Conda ──────────────────────────────────────────────────────────────────────
[conda]
symbol = "󰏗 "
style  = "fg:green"
format = '[[ $symbol$environment ](fg:green)]($style)'

# ── Package version ────────────────────────────────────────────────────────────
[package]
symbol   = "󰏗 "
style    = "fg:peach"
format   = '[[ $symbol$version ](fg:peach)]($style)'
disabled = false

# ── Right side ─────────────────────────────────────────────────────────────────
[fill]
symbol = " "
style  = "fg:surface0"

[cmd_duration]
min_time = 500
style    = "fg:yellow"
format   = '[󱎫 $duration ]($style)'

[time]
disabled    = false
time_format = "%H:%M"
style       = "fg:subtext1"
format      = '[󰥔 $time ]($style)'

# ── Prompt character ───────────────────────────────────────────────────────────
[character]
success_symbol = '[❯](bold green)'
error_symbol   = '[❯](bold red)'
vimcmd_symbol  = '[❮](bold mauve)'
